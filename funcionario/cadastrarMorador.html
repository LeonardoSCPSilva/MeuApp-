<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Morador</title>
    <link rel="stylesheet" href="../estilos/base.css">
    <link rel="stylesheet" href="../estilos/paginasFuncionario.css">
</head>

<body>
    <div class="container">
        <aside class="sidebar"></aside>

        <main class="content">
            <h1>Cadastrar Morador</h1>

            <section class="formularioCadastro">
                <form id="formCadastroMorador">
                    <div class="camposCadastro">
                        <div class="campoCadastro">
                            <label for="nome">Nome</label>
                            <input type="text" id="nome" name="nome" autocomplete="name" required>
                        </div>

                        <div class="campoCadastro">
                            <label for="cpf">CPF</label>
                            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00"
                                inputmode="numeric" maxlength="14"
                                pattern="[0-9]{11}|[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" required>
                        </div>

                        <div class="campoCadastro">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" autocomplete="email" required>
                        </div>

                        <div class="campoCadastro">
                            <label for="telefone">Telefone</label>
                            <input type="tel" id="telefone" name="telefone" autocomplete="tel"
                                placeholder="(00) 00000-0000" required>
                        </div>

                        <div class="campoCadastro">
                            <label for="dataNascimento">Data de Nascimento</label>
                            <input type="date" id="dataNascimento" name="dataNascimento" required>
                        </div>

                        <div class="campoCadastro">
                            <label for="bloco">Bloco</label>
                            <input type="text" id="bloco" name="bloco" placeholder="Ex.: Bloco A">
                        </div>
                        <div class="campoCadastro">
                            <label for="apartamento">Apartamento</label>
                            <input type="text" id="apartamento" name="apartamento" placeholder="Ex.: 101">
                        </div>
                    </div>

                    <p class="mensagemCadastro" id="mensagemCadastro" role="status" aria-live="polite"></p>

                    <div class="acoesCadastro">
                        <a class="btnVoltarCadastro" href="moradores.html">Cancelar</a>
                        <button class="btnSalvarCadastro" type="submit">Cadastrar morador</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script src="../JavaScript/menu.js"></script>
    <script src="../JavaScript/dados.js"></script>
    <script src="../JavaScript/cadastrarMorador.js"></script>
</body>

</html>
