<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Área</title>
    <link rel="stylesheet" href="../estilos/base.css">
    <link rel="stylesheet" href="../estilos/paginasFuncionario.css">
</head>

<body>
    <div class="container">
        <aside class="sidebar"></aside>

        <main class="content">
            <h1>Cadastrar Área Comum</h1>

            <section class="formularioCadastro">
                <form id="formCadastroArea">
                    <div class="camposCadastro">
                        <div class="campoCadastro">
                            <label for="nome">Nome da área</label>
                            <input type="text" id="nome" name="nome" required>
                        </div>

                        <div class="campoCadastro">
                            <label for="horarioInicial">Horário de abertura</label>
                            <input type="number" id="horarioInicial" name="horarioInicial"
                                min="0" max="23" value="8" required>
                        </div>

                        <div class="campoCadastro">
                            <label for="horarioFinal">Horário de fechamento</label>
                            <input type="number" id="horarioFinal" name="horarioFinal"
                                min="1" max="24" value="22" required>
                        </div>

                        <div class="campoCadastro">
                            <label for="fotoArea">Foto da área</label>
                            <input type="file" id="fotoArea" name="fotoArea"
                                accept="image/jpeg,image/png,image/webp" required>
                        </div>

                        <div class="campoCadastro campoCadastroCompleto">
                            <label for="regras">Regras da área</label>
                            <textarea id="regras" name="regras" rows="5" required></textarea>
                        </div>
                    </div>

                    <div class="previewFotoArea" id="containerPreviewFoto" hidden>
                        <img id="previewFotoArea" alt="Prévia da foto da área">
                    </div>

                    <p class="mensagemCadastro" id="mensagemCadastro" role="status" aria-live="polite"></p>

                    <div class="acoesCadastro">
                        <a class="btnVoltarCadastro" href="areasComum.html">Cancelar</a>
                        <button class="btnSalvarCadastro" type="submit">Cadastrar área</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script src="../JavaScript/menu.js"></script>
    <script src="../JavaScript/dados.js"></script>
    <script src="../JavaScript/cadastrarArea.js"></script>
</body>

</html>
