<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunicados - Morador</title>
    <link rel="stylesheet" href="../estilos/base.css">
    <link rel="stylesheet" href="../estilos/paginasFuncionario.css">
</head>

<body>

    <div class=" container">

        <aside class="sidebar"></aside>

        <main class="content">

            <h1>Gestão de Áreas Comuns</h1>

            <section class="cards">

                <div class="card">
                    <h2 id="totalAreas">0</h2>
                    <p>Áreas Comuns Cadastradas</p>
                </div>

                <div class="card">
                    <h2 id="ativas">0</h2>
                    <p>Áreas Comuns Ativas</p>
                </div>

            </section>

            <section class="feed">

                <section class="filtros">

                    <div class="busca">
                        <input type="text" id="buscarAreas" placeholder="Buscar áreas..."
                            onkeyup="buscarAreas()">
                    </div>

                    <button class="btnCadastrar" onclick="window.location.href='cadastrarArea.html'">
                     Cadastrar Área
                    </button>

                </section>

                <div id="listaAreas"></div>

            </section>

        </main>
    </div>

    <script src="../JavaScript/menu.js"></script>
    <script src="../JavaScript/dados.js"></script>
    <script src="../JavaScript/areaComumF.js"></script>

</body>

</html>
